<style>
:root{--blue:#0e63e6;--bg:#f2f4f8;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;--sel:#e7f0ff;--green:#0a8f4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
.top small{display:block;font-size:11px;opacity:.85;font-weight:400}
#lang{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:20px;font-size:15px;font-weight:600;min-width:64px;height:40px;padding:0 12px}
.sbox{position:relative}
#q{width:100%;font-size:20px;height:54px;border-radius:14px;border:none;padding:0 48px 0 16px;outline:none;color:var(--text);-webkit-appearance:none;appearance:none}
#clr{position:absolute;right:6px;top:7px;width:40px;height:40px;border:none;background:#e5e7eb;border-radius:20px;font-size:20px;color:#555;display:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;z-index:9}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#f7f8fa;font-size:15px;font-weight:600;color:#333}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
main{padding:10px 10px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto}
.hint{color:var(--muted);text-align:center;padding:20px 10px;font-size:15px;line-height:1.6}
.ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.ex button{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-size:15px}
.notes{background:#fff8e1;border:1px solid #f5d98b;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.5}
.notes b,.cn b{display:block;margin-bottom:2px}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.card{background:var(--card);border-radius:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.ch{padding:12px 14px 6px}
.ch h2{margin:0;font-size:21px;line-height:1.25}
.src{font-size:12px;color:var(--muted);margin-top:3px}
.grp{padding:6px 14px 2px;font-size:12px;font-weight:700;color:var(--blue);text-transform:none;border-top:1px solid var(--line);margin-top:4px;background:#fafbff}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;min-height:56px;border-top:1px solid #f1f2f4;cursor:pointer;user-select:none;-webkit-user-select:none}
.it:active{background:#f3f6fb}
.it.sel{background:var(--sel)}
.it .l{flex:1;min-width:0}
.it .l .a{font-size:16px;font-weight:600;line-height:1.3}
.it .l .o{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.it .p{font-size:26px;font-weight:800;color:var(--green);white-space:nowrap}
.it .p.s{font-size:18px}
.ck{width:24px;height:24px;border-radius:12px;border:2px solid #c7ccd4;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.it.sel .ck{background:var(--blue);border-color:var(--blue)}
.tag{display:inline-block;font-size:11px;background:#fde8e8;color:#b42318;border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600;vertical-align:middle}
.cn{font-size:12px;color:#7a5b00;background:#fffbeb;padding:6px 14px;border-top:1px solid #f1f2f4;line-height:1.5}
.cf{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.cf button{height:50px;border-radius:12px;font-size:17px;font-weight:700;border:none}
.cp{flex:1;background:var(--blue);color:#fff}
.cp:active{opacity:.8}
.cl{background:#eef0f3;color:#333;padding:0 16px}
.more{display:block;width:100%;height:50px;border-radius:12px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-size:16px;font-weight:600}
#fab{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:56px;border:none;border-radius:16px;background:var(--green);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;z-index:40;max-width:736px;margin:0 auto}
#toast{position:fixed;left:50%;width:calc(100vw - 32px);max-width:560px;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:92vw;display:none;z-index:50;line-height:1.45;white-space:pre-wrap}
</style>
</head>

if (params.get('brand')) brand = params.get('brand');

function pretty(m) {
  m = String(m).replace(/\s+/g, ' ').trim();
  if (/IPHONE|IPAD|AIRPOD/.test(m) && m === m.toUpperCase()) {
    m = m.toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
  }
  return m.replace(/\bIphone\b/gi, 'iPhone').replace(/\bIpad/gi, 'iPad').replace(/\bIwatch\b/gi, 'iWatch')
          .replace(/\bAirpod\b/gi, 'AirPods').replace(/\b(\d+)(gb|tb)\b/gi, function(a,n,u){return n+u.toUpperCase();});
}
// build cards: one per brand + model text; items grouped by sheet/section
var cards = [], byKey = {};
D.rows.forEach(function (r, ri) {
  var key = r.b + '|' + r.m.toLowerCase().replace(/\s+/g, ' ').trim();
  var c = byKey[key];
  if (!c) { c = byKey[key] = {id: cards.length, key: key, brand: r.b, model: r.m, name: pretty(r.m), alts: alternatives(r.m), rows: []}; cards.push(c); }
  c.rows.push(r);
});
var LATE = {'Apple Genuine Parts': 1, 'Apple Memory Upgarde': 2, 'Apple & Samung Board Repair': 3};
cards.forEach(function (c) { c.rows.sort(function (a, b) { return (LATE[D.sheets[a.s]] || 0) - (LATE[D.sheets[b.s]] || 0); }); });
function price(p) { return typeof p === 'number' ? '$' + p : String(p).replace(/\s+/g, ' ').trim(); }
function lab(it) { return it[2] || D.labels[it[0]]; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function t(k, n) { return T[lang][k].replace('{n}', n); }

function renderChips() {
  var h = '<button class="chip' + (brand ? '' : ' on') + '" data-b="">' + t('all') + '</button>';
  BRANDS.forEach(function (b) { h += '<button class="chip' + (brand === b ? ' on' : '') + '" data-b="' + b + '">' + b + '</button>'; });
  document.getElementById('chips').innerHTML = h;
}
function notesFor(sheetIdxs) {
  var h = '';
  sheetIdxs.forEach(function (s) {
    var n = D.notes[D.sheets[s]];
    if (n && n.length) h += '<div><b>' + esc(D.sheets[s]) + '</b>' + n.map(esc).join('<br>') + '</div>';
  });
  return h;
}
function cardHTML(c) {
  var h = '<div class="card" data-c="' + c.id + '"><div class="ch"><h2>' + esc(c.name) + '</h2>';
  var srcs = [], sheetIdx = [];
  c.rows.forEach(function (r) { if (sheetIdx.indexOf(r.s) < 0) sheetIdx.push(r.s); });
  h += '<div class="src">' + esc(c.brand) + ' · ' + sheetIdx.map(function (s) { return esc(D.sheets[s]); }).join(' · ') + '</div></div>';
  var s = sel[c.id] || {};
  c.rows.forEach(function (r, ri) {
    var g = D.sheets[r.s] + (r.c ? ' · ' + r.c : '');
    if (r.f) g += ' · ' + Object.keys(r.f).map(function (k) { return k + ': ' + r.f[k]; }).join(', ');
    h += '<div class="grp">' + esc(g) + (r.n ? '<span class="tag">' + esc(r.n) + '</span>' : '') + '</div>';
    r.i.forEach(function (it, ii) {
      var L = lab(it), id = ri + '_' + ii, p = price(it[1]);
      h += '<div class="it' + (s[id] ? ' sel' : '') + '" data-i="' + id + '"><div class="ck">' + (s[id] ? '✓' : '') + '</div><div class="l"><div class="a">' + esc(L[lang]) + '</div><div class="o">' + esc(D.items[it[0]]) + '</div></div><div class="p' + (p.length > 6 ? ' s' : '') + '">' + esc(p) + '</div></div>';
    });
  });
  var nh = notesFor(sheetIdx);
  if (nh) h += '<div class="cn">' + nh + '</div>';
  var n = Object.keys(s).length;
  h += '<div class="cf"><button class="cp" type="button">' + (n ? t('copySel', n) : t('copy')) + '</button>' + (n ? '<button class="cl" type="button">' + t('clear') + '</button>' : '') + '</div></div>';
  return h;
}
function results() {
  var q = tokenize(query), list = [];
  cards.forEach(function (c, idx) {
    if (brand && c.brand !== brand) return;
    if (!q.length) { list.push({c: c, s: 0, i: idx}); return; }
    var sc = scoreModel(q, c.alts); if (sc > 0) sc -= (c.alts.length - 1);
    if (sc > 0) list.push({c: c, s: sc, i: idx});
  });
  list.sort(function (a, b) { return b.s - a.s || (LATE[D.sheets[a.c.rows[0].s]] || 0) - (LATE[D.sheets[b.c.rows[0].s]] || 0) || BRANDS.indexOf(a.c.brand) - BRANDS.indexOf(b.c.brand) || a.i - b.i; });
  return list;
}
function render() {
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
  document.getElementById('sub').textContent = t('sub');
  document.getElementById('lang').textContent = t('lang');
  document.getElementById('q').placeholder = t('ph');
  document.getElementById('clr').style.display = query ? 'block' : 'none';
  renderChips();
  var out = document.getElementById('out'), h = ''; if (typeof updateFab === 'function') setTimeout(updateFab);
  if (brand) {
    var sh = []; D.rows.forEach(function (r) { if (r.b === brand && sh.indexOf(r.s) < 0) sh.push(r.s); });
    var nh = notesFor(sh); if (nh) h += '<div class="notes">' + nh + '</div>';
  }
  if (!query.trim() && !brand) {
    h += '<div class="hint">' + t('hint') + '<div class="ex">' + ['12 pro max', 'a54', 'fold 5', 'pixel 8', 'ipad air 4', 'reno 12'].map(function (x) { return '<button type="button" data-q="' + x + '">' + x + '</button>'; }).join('') + '</div></div>';
    out.innerHTML = h; return;
  }
  var list = results();
  if (!list.length) h += '<div class="hint">' + t('none') + '</div>';
  else h += '<div class="src" style="margin:0 4px 8px">' + t('results', list.length) + '</div>';
  list.slice(0, limit).forEach(function (x) { h += cardHTML(x.c); });
  if (list.length > limit) h += '<button class="more" type="button">' + t('more') + ' (' + (list.length - limit) + ')</button>';
  out.innerHTML = h;
  updateFab();
}
function buildReply(c) {
  var s = sel[c.id] || {}, useAll = !Object.keys(s).length, groups = [], gmap = {}, order = false;
  c.rows.forEach(function (r, ri) {
    r.i.forEach(function (it, ii) {
      if (!useAll && !s[ri + '_' + ii]) return;
      var L = lab(it);
      if (r.n && /order/i.test(r.n)) order = true;
      var g = gmap[L.g]; if (!g) { g = gmap[L.g] = {name: L.g, parts: []}; groups.push(g); }
      var p = price(it[1]);
      g.parts.push(L.g === 'Storage upgrade' ? L.v + ' ' + p : p + (L.v ? ' (' + L.v + ')' : ''));
    });
  });
  var body = groups.map(function (g) { return g.name + ' ' + g.parts.join(' / '); }).join('; ');
  return 'Hi! For ' + c.name + ': ' + body + '.' + (order ? ' Parts need to be ordered.' : '') +
    ' Comes with 1 month warranty. Walk in to Sonic Mobile Connection, Lucky Plaza #04-29.';
}
var lastCard = null;
function updateFab() {
  var f = document.getElementById('fab'), c = lastCard, n = c ? Object.keys(sel[c.id] || {}).length : 0;
  if (!n) { f.style.display = 'none'; return; }
  f.textContent = t('copySel', n) + ' · ' + c.name; f.style.display = 'block';
}
function copyText(txt) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0'; document.body.appendChild(ta);
    var r = document.createRange(); r.selectNodeContents(ta); var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r);
    ta.setSelectionRange(0, 999999); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).catch(fallback); else fallback();
  var el = document.getElementById('toast'); el.textContent = t('copied') + '\n' + txt; el.style.display = 'block';
  clearTimeout(copyText.tm); copyText.tm = setTimeout(function () { el.style.display = 'none'; }, 3500);
}
window.__sonic = {cards: cards, buildReply: buildReply, sel: sel, results: function(q){query=q;return results();}};

var qEl = document.getElementById('q'); qEl.value = query;
var tm;
qEl.addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(function () { query = qEl.value; limit = 30; render(); window.scrollTo(0, 0); }, 80); });
document.getElementById('fab').onclick = function () { if (lastCard) copyText(buildReply(lastCard)); };
document.getElementById('clr').onclick = function () { qEl.value = ''; query = ''; render(); qEl.focus(); };
document.getElementById('lang').onclick = function () { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('sonic_lang', lang); render(); };
document.getElementById('chips').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; brand = b.dataset.b; limit = 30; render(); });
document.getElementById('out').addEventListener('click', function (e) {
  var ex = e.target.closest('[data-q]'); if (ex) { qEl.value = query = ex.dataset.q; render(); return; }
  if (e.target.closest('.more')) { limit += 30; render(); return; }
  var card = e.target.closest('.card'); if (!card) return;
  var c = cards[+card.dataset.c];
  var it = e.target.closest('.it');
  if (it) { var s = sel[c.id] = sel[c.id] || {}; if (s[it.dataset.i]) delete s[it.dataset.i]; else s[it.dataset.i] = 1; card.outerHTML = cardHTML(c); lastCard = c; updateFab(); return; }
  if (e.target.closest('.cp')) { copyText(buildReply(c)); return; }
  if (e.target.closest('.cl')) { sel[c.id] = {}; card.outerHTML = cardHTML(c); updateFab(); }
});
function fixChips(){ document.getElementById('chips').style.top = document.querySelector('header').offsetHeight + 'px'; }
window.addEventListener('resize', fixChips);
render(); fixChips();
})();
</script>
</body>
</html>
